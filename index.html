  animation:pop .9s cubic-bezier(.22,1,.36,1) .5s backwards}

<noscript><p style="text-align:center;padding:40px">ErPoetry | شعرکده — برای خواندن شعرها جاوااسکریپت را فعال کنید.</p></noscript>

<script>
const API='https://api.ganjoor.net/api/ganjoor';
const POEM_Q='?catInfo=true&catPoems=false&rhymes=true&recitations=false&images=false&songs=false&comments=false&verseDetails=true&navigation=true&relatedpoems=false';
const $=(s,r=document)=>r.querySelector(s);
const view=$('#view');
const toFa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const norm=s=>(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u065F\u0670\u200c]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim().toLowerCase();
const fixYK=s=>(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').trim();
const stripHtml=s=>s?new DOMParser().parseFromString(s,'text/html').body.textContent.trim():'';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SITE='ErPoetry | شعرکده';
const FORMAT_RX=[[/دوبیتی/,'دوبیتی'],[/رباعی/,'رباعی'],[/ترجیع/,'ترجیع‌بند'],[/ترکیب/,'ترکیب‌بند'],[/مسمط/,'مسمط'],[/مستزاد/,'مستزاد'],[/قصیده|قصاید/,'قصیده'],[/غزل/,'غزل'],[/مثنوی/,'مثنوی'],[/قطعه|قطعات/,'قطعه']];
function countBeits(vs,plain){
  if(vs&&vs.length){let n=0;for(const v of vs){if(v.versePosition===1||v.versePosition===3)continue;n++}return n}
  return plain?Math.ceil(plain.split(/\r?\n/).filter(Boolean).length/2):0;
}
function poemMeta(p,cc){
  const out=[],metres=new Set(),rhymes=new Set(),formats=new Set();
  const mname=m=>m&&(m.rhythm||m.name);
  (p.sections||p.poemSections||[]).forEach(s=>{
    const r=mname(s.ganjoorMetre)||(typeof s.rhythm==='string'?s.rhythm:'');
    if(r)metres.add(r);
    if(s.rhymeLetters)rhymes.add(s.rhymeLetters);
    if(typeof s.poemFormat==='string'&&isNaN(s.poemFormat))formats.add(s.poemFormat);
  });
  const pm=mname(p.ganjoorMetre)||(typeof p.rhythm==='string'?p.rhythm:'');
  if(pm)metres.add(pm);
  if(!formats.size){
    const trail=[p.fullTitle,p.title,cc&&cc.title,...((cc&&cc.ancestors)||[]).map(a=>a.title)].filter(Boolean).join(' ');
    const hit=FORMAT_RX.find(([rx])=>rx.test(trail));
    if(hit)formats.add(hit[1]);
  }
  const n=countBeits(p.verses,p.plainText);
  if(formats.size)out.push(['قالب',[...formats].slice(0,2).join('، ')]);
  if(n)out.push(['تعداد ابیات',toFa(n)+' بیت']);
  if(metres.size)out.push(['وزن',[...metres].slice(0,3).join('، ')]);
  if(rhymes.size)out.push(['قافیه',[...rhymes].slice(0,3).join('، ')]);
  return out;
}
const loadedFonts={};
const fontMode=()=>{try{return localStorage.getItem('gj-font')==='naskh'?'naskh':'nastaliq'}catch{return 'nastaliq'}};
function applyFont(m){
  document.documentElement.dataset.font=m;
  if(m==='nastaliq'&&!loadedFonts.n){
    loadedFonts.n=1;
    const l=document.createElement('link');l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400&display=swap';
    document.head.append(l);
  }
  document.querySelectorAll('.font-toggle').forEach(b=>{b.textContent=m==='naskh'?'نستعلیق':'خط عادی'});
}
const fontBtn=()=>h('button',{class:'btn font-toggle','aria-label':'تغییر خط شعر',text:fontMode()==='naskh'?'نستعلیق':'خط عادی',onclick:()=>{
  const m=fontMode()==='naskh'?'nastaliq':'naskh';
  try{localStorage.setItem('gj-font',m)}catch{}
  applyFont(m);
}});
const pop=list=>[...list].slice(0,14).forEach((c,i)=>{c.style.animation=`pop .65s cubic-bezier(.22,1,.36,1) ${i*40}ms backwards`});

function h(tag,p={},...kids){
  const e=document.createElement(tag);
  for(const [a,v] of Object.entries(p)){
    if(v==null||v===false)continue;
    if(a==='class')e.className=v;
    else if(a==='text')e.textContent=v;
    else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);
    else e.setAttribute(a,v===true?'':v);
  }
  kids.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))});
  return e;
}

/* ---------- data ---------- */
const cache=new Map();
async function get(path,fresh){
  if(!fresh&&cache.has(path))return cache.get(path);
  const res=await fetch(API+path);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(!fresh)cache.set(path,data);
  return data;
}
const getPoets=()=>get('/poets');

/* ---------- favorites, theme, toast ---------- */
const favs={
  all(){try{return JSON.parse(localStorage.getItem('gj-fav')||'[]')}catch{return[]}},
  has(id){return this.all().some(f=>f.id===id)},
  toggle(item){let a=this.all();const i=a.findIndex(f=>f.id===item.id);if(i>=0)a.splice(i,1);else a.unshift(item);localStorage.setItem('gj-fav',JSON.stringify(a));return i<0}
};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
(function theme(){
  const root=document.documentElement,btn=$('#theme'),mq=matchMedia('(prefers-color-scheme: light)');
  const names={auto:'مطابق سیستم',light:'روشن',dark:'تیره'};
  const mode=()=>names[root.dataset.mode]?root.dataset.mode:'auto';
  const resolve=m=>m==='auto'?(mq.matches?'light':'dark'):m;
  const paint=t=>{root.dataset.theme=t;$('meta[name=theme-color]').content=t==='dark'?'#0a0f2c':'#dff0ee'};
  function swap(t){
    if(root.dataset.theme===t)return;
    if(document.startViewTransition&&!reduced)document.startViewTransition(()=>paint(t));
    else paint(t);
  }
  function set(m){
    root.dataset.mode=m;
    try{localStorage.setItem('gj-theme',m)}catch{}
    btn.title='پوسته: '+names[m];swap(resolve(m));
  }
  root.dataset.mode=mode();btn.title='پوسته: '+names[mode()];
  btn.onclick=()=>{
    const order=['auto','light','dark'];
    const m=order[(order.indexOf(mode())+1)%3];
    set(m);toast('پوسته: '+names[m]);
  };
  mq.addEventListener('change',()=>{if(mode()==='auto')swap(resolve('auto'))});
})();
let pm=null;
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||pm)return;
  const t=e.target,x=e.clientX,y=e.clientY;
  pm=requestAnimationFrame(()=>{
    pm=null;const g=t.closest&&t.closest('.glass');
    if(!g||g.matches('.card,.row,.nav a'))return;
    const r=g.getBoundingClientRect();g.style.setProperty('--mx',(x-r.left)+'px');g.style.setProperty('--my',(y-r.top)+'px');
  });
},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
addEventListener('scroll',()=>$('.bar').classList.toggle('scrolled',scrollY>6),{passive:true});
$('#sf').addEventListener('submit',e=>{e.preventDefault();const t=$('#q').value.trim();if(t)location.hash='#/search/'+encodeURIComponent(t)});

/* ---------- poem helpers ---------- */
function toBlocks(verses,plain){
  const out=[];
  if(verses&&verses.length){
    const v=[...verses].sort((a,b)=>a.vOrder-b.vOrder);
    for(let i=0;i<v.length;i++){
      const a=v[i],b=v[i+1];
      if(a.versePosition===0&&b&&b.versePosition===1){out.push({t:'beit',a:a.text,b:b.text,m:a.coupletSummary||b.coupletSummary});i++}
      else if(a.versePosition===2&&b&&b.versePosition===3){out.push({t:'c',a:a.text,m:a.coupletSummary||b.coupletSummary});out.push({t:'c',a:b.text});i++}
      else out.push({t:(a.text||'').length>90?'p':'c',a:a.text,m:a.coupletSummary});
    }
  }else if(plain){
    const l=plain.split(/\r?\n/).filter(Boolean);
    for(let i=0;i<l.length;i+=2)out.push(l[i+1]!=null?{t:'beit',a:l[i],b:l[i+1]}:{t:'c',a:l[i]});
  }
  return out;
}
function renderBlocks(blocks,stagger,withMean){
  const box=h('div',{class:'poem'});
  blocks.forEach((b,i)=>{
    const cls=stagger?' rise':'';
    const st=stagger?`--i:${i}`:null;
    if(b.t==='beit')box.append(h('div',{class:'beit'+cls,style:st},h('span',{text:b.a}),h('span',{text:b.b})));
    else box.append(h('div',{class:(b.t==='p'?'para':'cline')+cls,style:st,text:b.a}));
    if(withMean&&b.m)box.append(h('div',{class:'mean',text:b.m}));
  });
  return box;
}
const blocksText=bl=>bl.map(b=>b.t==='beit'?b.a+'\n'+b.b:b.a).join('\n\n');
const poetOf=p=>(p.category&&p.category.poet&&p.category.poet.name)||(p.fullTitle||'').split('»')[0].trim();
function highlight(text,term){
  const i=norm(text).indexOf(norm(term));
  if(!term||i<0)return text;
  return [text.slice(0,i),h('mark',{text:text.slice(i,i+term.length)}),text.slice(i+term.length)];
}
function snippet(line,term,max=90){
  if(!line||line.length<=max)return line||'';
  const t=fixYK(term);let i=line.indexOf(t);
  if(i<0){const k=norm(line).indexOf(norm(term));i=k<0?0:Math.min(k,line.length-1)}
  let a=Math.max(0,i-Math.floor((max-t.length)/3)),b=Math.min(line.length,a+max);
  if(a>0){const sp=line.indexOf(' ',a);if(sp>-1&&sp<i)a=sp+1}
  if(b<line.length){const sp=line.lastIndexOf(' ',b);if(sp>i+t.length)b=sp}
  return (a>0?'... ':'')+line.slice(a,b).trim()+(b<line.length?' ...':'');
}
const skeleton=n=>h('div',{},Array.from({length:n},()=>h('div',{class:'skel'})));
function crumbs(items){
  const box=h('nav',{class:'crumbs','aria-label':'مسیر'});
  items.forEach((c,i)=>{
    if(i)box.append(h('i',{text:'›'}));
    box.append(c.href?h('a',{href:c.href,text:c.text}):h('span',{text:c.text}));
  });
  return box;
}
function errorBox(retry){
  return h('div',{class:'empty glass'},h('p',{text:'اتصال به سرور برقرار نشد. اینترنت را بررسی کنید و دوباره تلاش کنید.'}),h('button',{class:'btn primary',onclick:retry,text:'تلاش دوباره'}));
}

/* ---------- pages ---------- */
async function loadHero(box){
  if(!reduced&&box.firstElementChild&&!box.querySelector('.skel')){
    await Promise.all([...box.children].map(c=>c.animate([{opacity:1},{opacity:0,transform:'translateY(-8px)'}],{duration:240,easing:'ease-in',fill:'forwards'}).finished.catch(()=>{})));
  }
  box.replaceChildren(h('div',{class:'skel',style:'height:120px;margin:0 auto;max-width:560px'}));
  try{
    let p=await get('/poem/random',true);
    if(!p.verses||!p.verses.length)p=await get('/poem/'+p.id+POEM_Q);
    const blocks=toBlocks(p.verses,p.plainText).slice(0,2);
    const poet=poetOf(p);
    box.replaceChildren(
      renderBlocks(blocks,true),
      h('div',{class:'hero-meta'},
        h('div',{class:'hero-src rise',style:'--i:3'},h('a',{href:'#/poem/'+p.id,text:(p.title||p.fullTitle)}),' — ',poet),
        h('a',{class:'btn primary rise',style:'--i:4',href:'#/poem/'+p.id,text:'خواندن شعر کامل'}),
        h('button',{class:'btn rise',style:'--i:4',onclick:()=>loadHero(box),text:'شعر دیگر'}),
        (()=>{const b=fontBtn();b.classList.add('rise');b.style.setProperty('--i',5);return b})()
      )
    );
  }catch(e){box.replaceChildren(errorBox(()=>loadHero(box)))}
}

async function homePage(tok){
  const hero=h('section',{class:'hero glass'});
  const grid=h('div',{class:'grid'});
  const filter=h('input',{type:'search',placeholder:'جستجوی شاعر…','aria-label':'جستجوی شاعر',autocomplete:'off'});
  const count=h('span',{class:'muted'});
  view.replaceChildren(
    h('h1',{class:'hero-h',text:'شعری برای همین لحظه'}),hero,
    h('section',{class:'sec'},
      h('div',{class:'filter'},h('h2',{style:'margin:0',text:'شاعران'}),h('label',{class:'search'},filter),count),
      grid)
  );
  loadHero(hero);
  grid.append(skeleton(4));
  try{
    const poets=await getPoets();
    if(tok!==render.tok)return;
    const draw=()=>{
      const t=norm(filter.value);
      const list=poets.filter(p=>!t||norm(p.name).includes(t)||norm(p.nickname).includes(t));
      count.textContent=toFa(list.length)+' شاعر';
      grid.replaceChildren(...list.map(p=>{
        const born=p.birthYearInLHijri,died=p.deathYearInLHijri;
        const years=born&&died?`${toFa(born)} تا ${toFa(died)} هجری قمری`:(p.nickname||'');
        return h('a',{class:'card glass',href:'#/cat/'+p.rootCatId},
          h('span',{class:'avatar',style:'--h:'+((p.id*47)%360),text:(p.name||'؟').trim()[0]}),
          h('span',{},h('b',{text:p.name}),h('small',{text:years})));
      }));
      if(!list.length)grid.append(h('p',{class:'muted',text:'شاعری با این نام پیدا نشد.'}));
    };
    let ft;filter.addEventListener('input',()=>{clearTimeout(ft);ft=setTimeout(draw,120)});draw();pop(grid.children);
  }catch(e){grid.replaceChildren(errorBox(()=>render()))}
}

async function catPage(id,tok){
  view.replaceChildren(skeleton(5));
  const d=await get(`/cat/${id}?poems=true&mainSections=false`);
  if(tok!==render.tok)return;
  const cat=d.cat||d;
  const children=cat.children||[];
  const poems=cat.poems||[];
  const anc=(cat.ancestors||[]).filter(a=>a.id!==cat.id);
  document.title=cat.title+' | '+SITE;
  const desc=stripHtml(cat.descriptionHtml||cat.description||'');
  const head=h('section',{class:'head glass'},h('h1',{text:cat.title}));
  if(desc){const dd=h('p',{class:'desc',text:desc,title:'برای خواندن بیشتر بزنید'});dd.onclick=()=>dd.classList.toggle('open');head.append(dd)}
  const nodes=[crumbs([{text:'شعرکده',href:'#/'},...anc.map(a=>({text:a.title,href:'#/cat/'+a.id})),{text:cat.title}]),head];
  if(children.length){
    nodes.push(h('h2',{text:'بخش‌ها'}),h('div',{class:'grid',style:'margin-bottom:34px'},children.map(c=>
      h('a',{class:'card glass',href:'#/cat/'+c.id},h('span',{class:'avatar',style:'--h:'+((c.id*37)%360),text:'❖'}),h('b',{text:c.title})))));
  }
  if(poems.length){
    let shown=60,term='';
    const rows=h('div',{class:'rows'}),more=h('div',{class:'more'});
    const input=h('input',{type:'search',placeholder:'جستجو در این فهرست…','aria-label':'جستجو در فهرست',autocomplete:'off'});
    const draw=()=>{
      const list=poems.filter(p=>!term||norm(p.title+' '+(p.excerpt||'')).includes(term));
      rows.replaceChildren(...list.slice(0,shown).map(p=>h('a',{class:'row glass',href:'#/poem/'+p.id},h('b',{text:p.title}),p.excerpt?h('p',{text:p.excerpt}):null)));
      more.replaceChildren(list.length>shown?h('button',{class:'btn',text:`نمایش بیشتر (${toFa(list.length-shown)} شعر دیگر)`,onclick:()=>{shown+=100;draw()}}):'');
      if(!list.length)rows.append(h('p',{class:'muted',text:'موردی پیدا نشد.'}));
    };
    let dt;input.addEventListener('input',()=>{clearTimeout(dt);dt=setTimeout(()=>{term=norm(input.value);shown=60;draw()},150)});
    nodes.push(h('div',{class:'filter'},h('h2',{style:'margin:0',text:toFa(poems.length)+' شعر'}),poems.length>10?h('label',{class:'search'},input):null),rows,more);
    draw();
  }
  if(!children.length&&!poems.length)nodes.push(h('p',{class:'muted',text:'این بخش شعری ندارد.'}));
  view.replaceChildren(...nodes);pop(view.querySelectorAll('.grid>.card,.rows>.row'));
}

async function poemPage(id,tok){
  view.replaceChildren(skeleton(5));
  const p=await get('/poem/'+id+POEM_Q);
  if(tok!==render.tok)return;
  const poet=poetOf(p);
  const blocks=toBlocks(p.verses,p.plainText);
  document.title=`${p.title} — ${poet} | ${SITE}`;
  const cc=p.category&&p.category.cat;
  let trail;
  if(cc&&cc.id){
    trail=[{text:'شعرکده',href:'#/'},...(cc.ancestors||[]).map(a=>({text:a.title,href:'#/cat/'+a.id})),{text:cc.title,href:'#/cat/'+cc.id}];
  }else{
    trail=[{text:'شعرکده',href:'#/'},...(p.fullTitle||'').split('»').slice(0,-1).map(s=>({text:s.trim()}))];
  }
  const item={id:p.id,title:p.title,poet};
  const favBtn=h('button',{class:'btn','aria-pressed':String(favs.has(p.id)),text:favs.has(p.id)?'در دلخواه‌ها':'افزودن به دلخواه‌ها'});
  favBtn.onclick=()=>{const on=favs.toggle(item);favBtn.setAttribute('aria-pressed',String(on));favBtn.textContent=on?'در دلخواه‌ها':'افزودن به دلخواه‌ها';toast(on?'به دلخواه‌ها اضافه شد':'از دلخواه‌ها برداشته شد')};
  const size=Number(localStorage.getItem('gj-fs')||1.28);
  document.documentElement.style.setProperty('--fs',size+'rem');
  const bump=d=>{const s=Math.min(2.2,Math.max(.95,(Number(localStorage.getItem('gj-fs')||1.28)+d)));localStorage.setItem('gj-fs',s.toFixed(2));document.documentElement.style.setProperty('--fs',s+'rem')};
  const copy=h('button',{class:'btn',text:'رونوشت متن',onclick:async()=>{try{await navigator.clipboard.writeText(`${p.title} — ${poet}\n\n${blocksText(blocks)}`);toast('متن شعر رونوشت شد')}catch{toast('رونوشت انجام نشد')}}});
  const nav=h('div',{class:'nav'},
    p.previous?h('a',{class:'glass',href:'#/poem/'+p.previous.id},h('small',{text:'شعر قبلی'}),p.previous.title):h('span'),
    p.next?h('a',{class:'glass',href:'#/poem/'+p.next.id},h('small',{text:'شعر بعدی'}),p.next.title):h('span'));
  if(location.search.includes('debug'))console.log('[ErPoetry] poem',p);
  const meta=poemMeta(p,cc);
  const facts=meta.length?h('div',{class:'facts'},meta.map(([k,v])=>h('span',{class:'fact'},h('small',{text:k}),h('b',{text:v})))):null;
  const sum=(p.poemSummary||'').trim();
  const sumBox=sum?h('div',{class:'sum'},h('b',{text:'خلاصهٔ شعر'}),h('p',{text:sum})):null;
  const poemEl=renderBlocks(blocks,false,true);
  const meanOn=()=>{try{return localStorage.getItem('gj-mean')!=='0'}catch{return true}};
  poemEl.classList.toggle('show-mean',meanOn());
  const meanBtn=blocks.some(b=>b.m)?h('button',{class:'btn','aria-pressed':String(meanOn()),text:'معنی ابیات',onclick:e=>{
    const on=!poemEl.classList.contains('show-mean');
    poemEl.classList.toggle('show-mean',on);e.currentTarget.setAttribute('aria-pressed',String(on));
    try{localStorage.setItem('gj-mean',on?'1':'0')}catch{}
  }}):null;
  view.replaceChildren(
    crumbs(trail),
    h('article',{class:'sheet glass'},
      h('h1',{text:p.title}),h('p',{class:'by',text:poet}),
      facts,sumBox,poemEl,
      h('div',{class:'tools'},favBtn,copy,fontBtn(),meanBtn,h('button',{class:'btn',onclick:()=>bump(.12),'aria-label':'بزرگ‌تر کردن متن',text:'A+'}),h('button',{class:'btn',onclick:()=>bump(-.12),'aria-label':'کوچک‌تر کردن متن',text:'A−'}))),
    nav);
}

async function crawlTitles(rootId,t,tok,onHit){
  const queue=[rootId];let seen=0;
  const worker=async()=>{
    while(queue.length&&seen<60&&tok===render.tok){
      const id=queue.shift();seen++;
      let d;try{d=await get(`/cat/${id}?poems=true&mainSections=false`)}catch{continue}
      const c=d.cat||d;
      (c.children||[]).forEach(x=>queue.push(x.id));
      const hs=(c.poems||[]).filter(x=>norm(x.title).includes(t));
      if(hs.length&&tok===render.tok)onHit(hs,c);
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);
  return {truncated:queue.length>0};
}

async function searchPage(term,poetId,tok){
  document.title=`جستجوی «${term}» | ${SITE}`;
  $('#q').value=term;
  const poets=await getPoets().catch(()=>[]);
  if(tok!==render.tok)return;
  const t=norm(term);
  const hits=poets.filter(p=>norm(p.name).includes(t)||norm(p.nickname).includes(t)).slice(0,12);
  const scopePoet=poetId&&poetId!=='0'?poets.find(p=>String(p.id)===String(poetId)):null;
  const scope=h('select',{'aria-label':'محدوده جستجو'},h('option',{value:'0',text:'همهٔ شاعران'}),poets.map(p=>h('option',{value:p.id,text:p.name,selected:String(p.id)===String(poetId)})));
  scope.onchange=()=>{location.hash=`#/search/${encodeURIComponent(term)}/${scope.value}`};

  const poetSec=hits.length?h('section',{},h('div',{class:'sec-h'},h('h2',{text:'شاعران'}),h('span',{class:'note',text:toFa(hits.length)+' شاعر'})),h('div',{class:'chips'},hits.map(p=>h('a',{class:'btn',href:'#/cat/'+p.rootCatId,text:p.name})))):null;

  const titleRows=h('div',{class:'rows'}),titleNote=h('span',{class:'note'}),titleMore=h('div',{class:'more'});
  const titleSec=scopePoet
    ?h('section',{},h('div',{class:'sec-h'},h('h2',{text:'عنوان شعرها'}),titleNote),titleRows,titleMore)
    :h('p',{class:'note',style:'margin-top:8px',text:'برای جستجو در عنوان شعرها، یک شاعر را از فهرست بالا انتخاب کنید.'});

  const rows=h('div',{class:'rows'}),more=h('div',{class:'more'}),title=h('h2',{text:'در حال جستجو…'});
  view.replaceChildren(
    h('div',{class:'filter'},h('h1',{text:'نتایج جستجو'}),scope),
    poetSec,titleSec,
    h('div',{class:'sec-h'},title),rows,more);
  rows.append(skeleton(4));

  if(scopePoet){
    const thits=[];let shownT=30;
    const drawT=()=>{
      titleRows.replaceChildren(...thits.slice(0,shownT).map(x=>h('a',{class:'row glass',href:'#/poem/'+x.p.id},h('b',{},highlight(x.p.title,term)),h('p',{text:x.c}))));
      titleMore.replaceChildren(thits.length>shownT?h('button',{class:'btn',text:'نمایش بیشتر',onclick:()=>{shownT+=60;drawT()}}):'');
    };
    titleNote.textContent='در حال جستجو در آثار '+scopePoet.name+'…';
    crawlTitles(scopePoet.rootCatId,t,tok,(hs,c)=>{hs.forEach(x=>thits.push({p:x,c:c.title}));drawT()}).then(r=>{
      if(tok!==render.tok)return;
      const part=r.truncated?' (فقط بخشی از آثار بررسی شد)':'';
      titleNote.textContent=(thits.length?toFa(thits.length)+' عنوان':'عنوانی پیدا نشد')+part;
    });
  }

  let page=1,total=null,loaded=0;
  const size=20;
  const fetchPage=async()=>{
    let url=`${API}/poems/search?term=${encodeURIComponent(fixYK(term))}&PageNumber=${page}&PageSize=${size}`;
    if(scopePoet)url+='&poetId='+scopePoet.id;
    const res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    try{const po=JSON.parse(res.headers.get('x-paging-options')||'null');if(po&&po.totalCount!=null)total=po.totalCount}catch{}
    return res.json();
  };
  const load=async()=>{
    more.replaceChildren();
    try{
      const items=await fetchPage();
      if(tok!==render.tok)return;
      if(page===1)rows.replaceChildren();
      items.forEach(r=>{
        const id=r.id??r.poemId;
        const lines=(r.plainText||r.excerpt||'').split(/\r?\n/).filter(Boolean);
        const line=lines.find(l=>norm(l).includes(t))||lines[0]||'';
        rows.append(h('a',{class:'row glass',href:'#/poem/'+id},
          h('b',{},highlight(r.fullTitle||r.title||'شعر',term)),line?h('p',{},highlight(snippet(line,term),term)):null));
      });
      loaded+=items.length;if(page===1)pop(rows.children);
      title.textContent=loaded?(total!=null?`${toFa(total)} شعر با این عبارت در متن`:'شعرهای دارای این عبارت در متن'):`در متن شعرها نتیجه‌ای برای «${term}» پیدا نشد`;
      if(!loaded)rows.append(h('p',{class:'muted',text:'عبارت دیگری را امتحان کنید یا املای کلمه را بررسی کنید.'}));
      if(items.length===size&&(total==null||loaded<total))more.append(h('button',{class:'btn',text:'نمایش بیشتر',onclick:()=>{page++;load()}}));
    }catch(e){rows.replaceChildren(errorBox(()=>{rows.replaceChildren(skeleton(4));load()}));title.textContent='جستجو در متن انجام نشد'}
  };
  load();
}

function favPage(){
  document.title='دلخواه‌ها | '+SITE;
  const a=favs.all();
  view.replaceChildren(
    crumbs([{text:'شعرکده',href:'#/'},{text:'دلخواه‌ها'}]),
    h('h1',{text:'دلخواه‌ها',style:'margin-bottom:18px'}),
    a.length?h('div',{class:'rows'},a.map(f=>h('a',{class:'row glass',href:'#/poem/'+f.id},h('b',{text:f.title}),h('p',{text:f.poet}))))
      :h('div',{class:'empty glass'},h('p',{text:'هنوز شعری ذخیره نکرده‌اید. در صفحهٔ هر شعر «افزودن به دلخواه‌ها» را بزنید.'}),h('a',{class:'btn primary',href:'#/',text:'دیدن شاعران'})));
}

/* ---------- router ---------- */
async function render(){
  const tok=render.tok=(render.tok||0)+1;
  const parts=decodeURIComponent(location.hash.slice(1)).split('/').filter(Boolean);
  if(!reduced&&view.firstElementChild&&view.animate){
    const out=view.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-10px)'}],{duration:170,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
    await out.finished.catch(()=>{});
    out.cancel();
    if(tok!==render.tok)return;
  }
  scrollTo({top:0,behavior:'instant'});
  document.title=SITE;
  try{
    if(!parts.length)await homePage(tok);
    else if(parts[0]==='cat')await catPage(parts[1],tok);
    else if(parts[0]==='poem')await poemPage(parts[1],tok);
    else if(parts[0]==='search')await searchPage(parts[1]||'',parts[2]||'0',tok);
    else if(parts[0]==='fav')favPage();
    else await homePage(tok);
  }catch(e){
    if(tok===render.tok)view.replaceChildren(errorBox(render));
  }
  if(tok===render.tok&&!reduced&&view.animate)
    view.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'});
}
(function seo(){
  if(!/^https?:$/.test(location.protocol))return;
  const u=location.origin+location.pathname;
  const add=(tag,a)=>{const e=document.createElement(tag);for(const k in a)e.setAttribute(k,a[k]);document.head.append(e)};
  add('link',{rel:'canonical',href:u});add('meta',{property:'og:url',content:u});
})();
applyFont(fontMode());
addEventListener('hashchange',render);
render();
</script>

<style>
html{color-scheme:dark}
html[data-theme=light]{
  --edge:rgba(22,32,63,.08);--rim:#fff;color-scheme:light}
::view-transition-old(root),::view-transition-new(root){animation-duration:.5s;animation-timing-function:ease-out}
:root{
  --edge:rgba(255,255,255,.07);--rim:rgba(255,255,255,.85);
  --bg1:#080d28;--bg2:#10194a;
  --ink:#f4efe2;--ink2:rgba(244,239,226,.68);--ink3:rgba(244,239,226,.42);
  --g1:rgba(255,255,255,.13);--g2:rgba(255,255,255,.03);--gb:rgba(255,255,255,.2);--gh:rgba(255,255,255,.38);
  --shadow:rgba(0,0,0,.32);
  --turq:#3fd8c8;--saffron:#f3b94d;--lapis:#4b5fe6;--rose:#ef6f8f;
  --ui:'Vazirmatn',Tahoma,system-ui,sans-serif;--poem:'Noto Nastaliq Urdu','Vazirmatn',serif;
  --fs:1.28rem;
}
[data-theme=light]{
  --bg1:#dff0ee;--bg2:#f8eedb;
  --ink:#16203f;--ink2:rgba(22,32,63,.7);--ink3:rgba(22,32,63,.45);
  --g1:rgba(255,255,255,.7);--g2:rgba(255,255,255,.3);--gb:rgba(255,255,255,.9);--gh:rgba(255,255,255,1);
  --shadow:rgba(40,60,100,.18);
  --turq:#0e9f92;--saffron:#c98512;--lapis:#3347c9;--rose:#cf3d63;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:auto}
body{font-family:var(--ui);color:var(--ink);min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--turq);outline-offset:3px}

/* background liquid */
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;opacity:.55;animation:drift 32s ease-in-out infinite alternate}
.orb.a{width:46vmax;height:46vmax;background:radial-gradient(circle,var(--lapis),transparent 65%);top:-14vmax;right:-10vmax}
.orb.b{width:40vmax;height:40vmax;background:radial-gradient(circle,var(--turq),transparent 65%);bottom:-16vmax;left:-12vmax;animation-duration:38s;opacity:.4}
.orb.c{width:28vmax;height:28vmax;background:radial-gradient(circle,var(--saffron),transparent 65%);top:38%;left:30%;animation-duration:44s;opacity:.28}
@keyframes drift{to{transform:translate3d(-6vmax,5vmax,0) scale(1.15)}}

/* glass */
.glass{position:relative;isolation:isolate;
  background:radial-gradient(130% 100% at 0% 0%,rgba(255,255,255,.18),transparent 52%),linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
  border:1px solid var(--edge);border-radius:var(--r,26px);
  box-shadow:0 20px 50px -16px var(--shadow),0 2px 8px rgba(0,0,0,.08),inset 0 1px 1px var(--gh),inset 0 -12px 26px -14px rgba(255,255,255,.16),inset 0 0 24px rgba(255,255,255,.05)}
.glass::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:1;
  background:conic-gradient(from 215deg,var(--rim),color-mix(in srgb,var(--rim) 6%,transparent) 22%,color-mix(in srgb,var(--rim) 45%,transparent) 50%,color-mix(in srgb,var(--rim) 6%,transparent) 78%,var(--rim));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.13),transparent 62%);opacity:0;transition:opacity .5s}
.glass:hover::after{opacity:1}

/* layout */
.bar{position:sticky;top:12px;z-index:20;margin:12px auto 0;width:min(1100px,calc(100% - 24px));padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;--r:999px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;padding-inline:6px}
.bead{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 9%,transparent 10%),radial-gradient(circle at 60% 70%,var(--saffron),var(--rose) 55%,var(--lapis));box-shadow:inset 0 -4px 8px rgba(0,0,0,.25),0 4px 14px rgba(75,95,230,.5);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.brand:hover .bead{transform:rotate(25deg) scale(1.12)}
.search{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--gb);border-radius:999px;padding:2px 14px;transition:box-shadow .3s,background .3s}
.search:focus-within{background:rgba(255,255,255,.14);box-shadow:0 0 0 3px color-mix(in srgb,var(--turq) 40%,transparent)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:9px 0}
.search input::placeholder{color:var(--ink3)}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink);transition:background .25s,transform .25s}
.icon-btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{width:min(1100px,calc(100% - 24px));margin:28px auto 60px}
#view{min-height:60vh}
footer{text-align:center;color:var(--ink3);font-size:.82rem;padding:0 16px 40px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid var(--gb);background:linear-gradient(135deg,var(--g1),var(--g2));cursor:pointer;font-weight:600;transition:transform .25s cubic-bezier(.22,1,.36,1),background .25s,box-shadow .25s;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--shadow)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--saffron) 55%,transparent),color-mix(in srgb,var(--rose) 35%,transparent));border-color:color-mix(in srgb,var(--saffron) 60%,transparent)}
.btn[aria-pressed=true]{background:color-mix(in srgb,var(--rose) 40%,transparent)}

h1{font-weight:800;font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.5}
h2{font-weight:600;font-size:1.25rem;margin-bottom:14px}
.muted{color:var(--ink2)}
.sec{margin-top:44px}

/* hero */
.hero-h{text-align:center;margin-bottom:18px;color:var(--ink2);font-weight:300;font-size:clamp(1.1rem,3vw,1.4rem)}
.hero{padding:clamp(26px,5vw,56px) clamp(16px,4vw,48px);text-align:center;--r:34px;overflow:hidden}
.hero .poem{--fs:clamp(1.25rem,3.4vw,1.9rem)}
.hero-meta{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.hero-src{width:100%;color:var(--ink2);font-size:.95rem}
.hero-src a{border-bottom:1px dashed var(--ink3)}
.hero-src a:hover{color:var(--turq)}

/* poem text */
.poem{font-family:var(--poem);font-size:calc(var(--fs)*var(--fm,1));line-height:var(--lh,3)}
.beit{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,7vw,90px);padding:.25em 0}
.beit span:first-child{text-align:end}
.beit span:last-child{text-align:start}
.cline{text-align:center}
.para{text-align:justify;padding:.4em 0;line-height:calc(var(--lh,3) - .2)}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*140ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* poets */
.filter{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.filter .search{flex:0 1 340px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{--r:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:transform .35s cubic-bezier(.22,1,.36,1);content-visibility:auto;contain-intrinsic-size:80px}
.card:hover{transform:translateY(-4px) scale(1.02)}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.2rem;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 90% 75%),hsl(var(--h) 70% 45%));color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);box-shadow:inset 0 -3px 6px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.25)}
.card b{display:block;font-weight:600;line-height:1.5}
.card small{color:var(--ink2);font-size:.82rem}

/* lists */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--ink2);font-size:.9rem;margin-bottom:14px}
.crumbs a:hover{color:var(--turq)}
.crumbs i{font-style:normal;opacity:.5}
.head{padding:24px clamp(18px,3vw,34px);margin-bottom:22px}
.desc{margin-top:10px;color:var(--ink2);max-height:5.4em;overflow:hidden;cursor:pointer;transition:max-height .5s ease}
.desc.open{max-height:60em}
.rows{display:grid;gap:10px}
.row{--r:18px;display:block;padding:12px 18px;transition:transform .3s cubic-bezier(.22,1,.36,1);content-visibility:auto;contain-intrinsic-size:70px}
.row:hover{transform:translateX(-5px)}
.row b{font-weight:600}
.row p{color:var(--ink2);font-size:.95rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row mark,.hl{background:color-mix(in srgb,var(--saffron) 45%,transparent);color:inherit;border-radius:5px;padding:0 3px}
.more{display:flex;justify-content:center;margin-top:20px}

/* poem page */
.sheet{padding:clamp(22px,4vw,48px) clamp(14px,4vw,56px);--r:34px}
.sheet h1{text-align:center;margin-bottom:6px}
.sheet .by{text-align:center;color:var(--ink2);margin-bottom:26px}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.nav a{--r:20px;padding:12px 18px;transition:transform .3s}
.nav a:hover{transform:translateY(-3px)}
.nav small{display:block;color:var(--ink3)}
.nav a:last-child{text-align:start}
.nav a:first-child{text-align:end}

/* states */
.skel{height:64px;border-radius:20px;margin-bottom:10px;background:linear-gradient(100deg,var(--g2) 30%,var(--g1) 50%,var(--g2) 70%) 0 0/300% 100%;border:1px solid var(--gb);animation:sh 1.5s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.empty{padding:34px;text-align:center;--r:26px}
.empty p{margin-bottom:16px;color:var(--ink2)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px);opacity:0;padding:10px 22px;--r:999px;z-index:50;transition:all .4s cubic-bezier(.22,1,.36,1);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
select{background:rgba(255,255,255,.1);border:1px solid var(--gb);border-radius:999px;padding:8px 14px;max-width:100%}
select option{color:#111}

/* refinements: glass controls and motion */
.orb{will-change:transform}
.orb.d{width:22vmax;height:22vmax;background:radial-gradient(circle,var(--rose),transparent 65%);top:8%;left:6%;animation-duration:36s;opacity:.3}
.bar{transition:box-shadow .5s cubic-bezier(.22,1,.36,1)}
.bar.scrolled{box-shadow:0 24px 60px -14px var(--shadow),0 2px 8px rgba(0,0,0,.1),inset 0 1px 1px var(--gh),inset 0 0 28px rgba(255,255,255,.08)}
.search{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:inset 0 1px 1px var(--gh),inset 0 -6px 12px -8px rgba(255,255,255,.14)}
.btn{position:relative;box-shadow:inset 0 1px 1px var(--gh),inset 0 -8px 14px -8px rgba(255,255,255,.14),0 8px 20px -8px var(--shadow);transition:transform .5s cubic-bezier(.22,1,.36,1),background .4s,box-shadow .4s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:inset 0 1px 1px var(--gh),inset 0 -8px 14px -8px rgba(255,255,255,.2),0 14px 28px -10px var(--shadow)}
.btn:active{transform:scale(.95,.93);transition-duration:.12s}
.icon-btn{transition:background .35s,transform .5s cubic-bezier(.22,1,.36,1)}
.icon-btn:active{transform:scale(.88)}
#theme{position:relative}
#theme .ti{position:absolute;inset:0;margin:auto;opacity:0;transform:rotate(-80deg) scale(.4);transition:opacity .45s ease,transform .7s cubic-bezier(.22,1,.36,1)}
html[data-mode=auto] #theme .ti-auto,html[data-mode=light] #theme .ti-light,html[data-mode=dark] #theme .ti-dark{opacity:1;transform:none}
footer p+p{margin-top:4px}
footer strong{color:var(--ink2);font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
main{margin-bottom:72px}
.toast{bottom:calc(50px + env(safe-area-inset-bottom))}
.made{position:fixed;inset-inline:0;bottom:calc(10px + env(safe-area-inset-bottom));margin-inline:auto;width:fit-content;z-index:15;
  --r:999px;--rim:#f6dba0;--edge:rgba(243,185,77,.2);
  display:flex;align-items:center;gap:6px;padding:3px 13px;font-size:.72rem;line-height:1.7;color:var(--ink2);white-space:nowrap;pointer-events:none;user-select:none;
  -webkit-backdrop-filter:blur(18px) saturate(2) brightness(1.1);backdrop-filter:blur(18px) saturate(2) brightness(1.1);
  box-shadow:0 10px 26px -10px var(--shadow),inset 0 1px 1px var(--gh),inset 0 -6px 10px -6px rgba(255,255,255,.22),inset 0 0 14px rgba(255,255,255,.08);
  animation:pop .9s cubic-bezier(.22,1,.36,1) .5s backwards}
.made::before{padding:1px}
.made .heart{width:12px;height:12px;fill:#ef4444;filter:drop-shadow(0 0 5px rgba(239,68,68,.6));animation:beat 2.8s ease-in-out infinite}
@keyframes beat{0%,55%,100%{transform:scale(1)}12%{transform:scale(1.24)}26%{transform:scale(1)}40%{transform:scale(1.14)}}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:-8px auto 22px;max-width:780px}
.fact{display:inline-flex;align-items:baseline;gap:8px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--gh);font-size:.85rem;line-height:1.7}
.fact small{color:var(--ink3);font-size:.78rem}
.fact b{font-weight:600}
.sum{margin:0 auto 26px;max-width:68ch;padding:14px 20px;border-radius:20px;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--gh)}
.sum b{display:block;font-weight:600;color:var(--saffron);margin-bottom:2px}
.sum p{color:var(--ink2);line-height:2;text-align:justify}
.mean{font-family:var(--ui);font-size:.88rem;line-height:1.9;color:var(--ink2);text-align:center;max-width:50ch;margin:0 auto .9em}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec-h h2{margin:0}
.note{color:var(--ink3);font-size:.85rem}
/* layout fixes: header never overflows, long text never widens the page */
html,body{max-width:100%;overflow-x:clip}
.bar{padding:7px 10px}
.bar>*{flex:none}
.bar .search{flex:1 1 0;min-width:0}
.search input{width:100%;min-width:0}
@media(max-width:400px){.icon-btn{width:38px;height:38px}.bar{gap:2px}}
.rows{grid-template-columns:minmax(0,1fr)}
.row{min-width:0}
.row b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row p{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr))}
.beit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.poem{overflow-wrap:anywhere}
.card>span:last-child{min-width:0;overflow-wrap:anywhere}
html{--fm:.92;--lh:3}
/* ---- poem verses: number, tap-to-open details ---- */
.bt{position:relative}
.bn{display:none;margin:0 auto;border:0;background:none;color:#e5484d;font-family:var(--ui);font-weight:600;font-size:.8rem;line-height:1;padding:8px 12px 0;cursor:pointer}
.nums .bn{display:block}
.bv{cursor:pointer;border-radius:18px;transition:background .4s ease}

.cc .cline{text-align:center}
.info{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .6s cubic-bezier(.22,1,.36,1),opacity .45s ease;font-family:var(--ui);font-size:.9rem;line-height:1.9;text-align:right;overflow-wrap:break-word}
.bt.open .info{grid-template-rows:1fr;opacity:1}
.info>div{overflow:hidden;min-height:0}
.ibox{margin:8px auto 18px;max-width:640px;padding:12px 16px 16px;border-radius:22px;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--gh),0 16px 32px -20px var(--shadow)}

.kv.col{display:block}
.kv.col p{margin-top:2px;color:var(--ink);overflow-wrap:anywhere}

function h(tag,p={},...kids){
  const e=document.createElement(tag);
  for(const [a,v] of Object.entries(p)){
    if(v==null||v===false)continue;
    if(a==='class')e.className=v;
    else if(a==='text')e.textContent=v;
    else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);
    else e.setAttribute(a,v===true?'':v);
  }
  kids.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))});
  return e;
}

/* ---------- poem helpers ---------- */
function toBlocks(verses,plain){
  const out=[];
  if(verses&&verses.length){
    const v=[...verses].sort((a,b)=>a.vOrder-b.vOrder);
    for(let i=0;i<v.length;i++){
      const a=v[i],b=v[i+1];
      if(a.versePosition===0&&b&&b.versePosition===1){out.push({t:'beit',a:a.text,b:b.text,m:a.coupletSummary||b.coupletSummary});i++}
      else if(a.versePosition===2&&b&&b.versePosition===3){out.push({t:'cc',a:a.text,b:b.text,m:a.coupletSummary||b.coupletSummary});i++}
      else out.push({t:(a.text||'').length>90?'p':'c',a:a.text,m:a.coupletSummary});
    }
  }else if(plain){
    const l=plain.split(/\r?\n/).filter(Boolean);
    for(let i=0;i<l.length;i+=2)out.push(l[i+1]!=null?{t:'beit',a:l[i],b:l[i+1]}:{t:'c',a:l[i]});
  }
  return out;
}
function renderBlocks(blocks,stagger,opts){
  opts=opts||{};
  const box=h('div',{class:'poem'+(opts.numbers?' nums':'')});
  const mk=b=>{
    if(b.t==='beit')return h('div',{class:'beit'},h('span',{text:b.a}),h('span',{text:b.b}));
    if(b.t==='cc')return h('div',{class:'cc'},h('div',{class:'cline',text:b.a}),h('div',{class:'cline',text:b.b}));
    return h('div',{class:b.t==='p'?'para':'cline',text:b.a});
  };
  blocks.forEach((b,i)=>{
    const cls=stagger?' rise':'';
    const st=stagger?`--i:${i}`:null;
    if(opts.interactive){
      box.append(h('div',{class:'bt'+cls,style:st,'data-i':i},
        h('button',{class:'bn',type:'button','aria-label':'جزئیات بیت '+toFa(i+1),text:toFa(i+1)}),
        h('div',{class:'bv',role:'button',tabindex:'0'},mk(b)),
        h('div',{class:'info'},h('div'))));
    }else{
      const el=mk(b);
      if(stagger){el.classList.add('rise');el.style.setProperty('--i',i)}
      box.append(el);
      if(opts.mean&&b.m)box.append(h('div',{class:'mean',text:b.m}));
    }
  });
  if(opts.interactive){
    const toggle=i=>{
      const w=box.children[i];if(!w)return;
      const was=w.classList.contains('open');
      box.querySelectorAll('.bt.open').forEach(x=>x.classList.remove('open'));
      if(was)return;
      const holder=w.querySelector('.info>div');
      if(!holder.firstChild)holder.append(buildInfo(blocks[i],i,opts.ctx));
      requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
    };
    box.addEventListener('click',e=>{
      const w=e.target.closest('.bt');
      if(!w||e.target.closest('.info'))return;
      toggle(+w.dataset.i);
    });
    box.addEventListener('keydown',e=>{
      if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('bv')){e.preventDefault();toggle(+e.target.closest('.bt').dataset.i)}
    });
  }
  return box;
}
const blocksText=bl=>bl.map(b=>b.t==='beit'||b.t==='cc'?b.a+'\n'+b.b:b.a).join('\n\n');
const poetOf=p=>(p.category&&p.category.poet&&p.category.poet.name)||(p.fullTitle||'').split('»')[0].trim();
function highlight(text,term){
  const i=norm(text).indexOf(norm(term));
  if(!term||i<0)return text;
  return [text.slice(0,i),h('mark',{text:text.slice(i,i+term.length)}),text.slice(i+term.length)];
}
function snippet(line,term,max=90){
  if(!line||line.length<=max)return line||'';
  const t=fixYK(term);let i=line.indexOf(t);
  if(i<0){const k=norm(line).indexOf(norm(term));i=k<0?0:Math.min(k,line.length-1)}
  let a=Math.max(0,i-Math.floor((max-t.length)/3)),b=Math.min(line.length,a+max);
  if(a>0){const sp=line.indexOf(' ',a);if(sp>-1&&sp<i)a=sp+1}
  if(b<line.length){const sp=line.lastIndexOf(' ',b);if(sp>i+t.length)b=sp}
  return (a>0?'... ':'')+line.slice(a,b).trim()+(b<line.length?' ...':'');
}

async function crawlTitles(rootId,t,tok,onHit){
  const queue=[rootId];let seen=0;
  const worker=async()=>{
    while(queue.length&&seen<60&&tok===render.tok){
      const id=queue.shift();seen++;
      let d;try{d=await get(`/cat/${id}?poems=true&mainSections=false`)}catch{continue}
      const c=d.cat||d;
      (c.children||[]).forEach(x=>queue.push(x.id));
      const hs=(c.poems||[]).filter(x=>norm(x.title).includes(t));
      if(hs.length&&tok===render.tok)onHit(hs,c);
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);
  return {truncated:queue.length>0};
}

    };

    crawlTitles(scopePoet.rootCatId,t,tok,(hs,c)=>{hs.forEach(x=>thits.push({p:x,c:c.title}));drawT()}).then(r=>{

      titleNote.textContent=(thits.length?toFa(thits.length)+' عنوان':'عنوانی پیدا نشد')+part;
    });
  }

  let page=1,total=null,loaded=0;
  const size=20;
  const fetchPage=async()=>{
    let url=`${API}/poems/search?term=${encodeURIComponent(fixYK(term))}&PageNumber=${page}&PageSize=${size}`;
    if(scopePoet)url+='&poetId='+scopePoet.id;
    const res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    try{const po=JSON.parse(res.headers.get('x-paging-options')||'null');if(po&&po.totalCount!=null)total=po.totalCount}catch{}

  };
  const load=async()=>{

    }catch(e){rows.replaceChildren(errorBox(()=>{rows.replaceChildren(skeleton(4));load()}));title.textContent='جستجو در متن انجام نشد'}
  };
  load();
}

async function render(){

/* ================= abjad and letters ================= */
const ABJAD={'ا':1,'ب':2,'ج':3,'د':4,'ه':5,'و':6,'ز':7,'ح':8,'ط':9,'ی':10,'ک':20,'ل':30,'م':40,'ن':50,'س':60,'ع':70,'ف':80,'ص':90,'ق':100,'ر':200,'ش':300,'ت':400,'ث':500,'خ':600,'ذ':700,'ض':800,'ظ':900,'غ':1000};
const L1={'آ':'ا','أ':'ا','إ':'ا','ٱ':'ا','ي':'ی','ى':'ی','ئ':'ی','ك':'ک','ة':'ه','ؤ':'و'};
const L2={'پ':'ب','چ':'ج','ژ':'ز','گ':'ک'};
const isLetter=c=>/[\u0621-\u063A\u0641-\u064A\u0671\u067E\u0686\u0698\u06A9\u06AF\u06CC]/.test(c);
const letterOf=c=>isLetter(c)?(L1[c]||c):null;
const abjadVal=c=>{const l=letterOf(c);return l?(ABJAD[L2[l]||l]||0):0};
const abjadSum=t=>[...(t||'')].reduce((n,c)=>n+abjadVal(c),0);
const ABJ_ORDER=[['غ',1000],['ظ',900],['ض',800],['ذ',700],['خ',600],['ث',500],['ت',400],['ش',300],['ر',200],['ق',100],['ص',90],['ف',80],['ع',70],['س',60],['ن',50],['م',40],['ل',30],['ک',20],['ی',10],['ط',9],['ح',8],['ز',7],['و',6],['ه',5],['د',4],['ج',3],['ب',2],['ا',1]];
function numToLetters(n){let s='';for(const [c,v] of ABJ_ORDER){while(n>=v){s+=c;n-=v}}return s}

const WORDS='الله محمد علی حسن حسین فاطمه زهرا مریم عیسی موسی ابراهیم یوسف یعقوب آدم نوح رحمان رحیم کریم عشق دل جان یار دوست مهر نور عقل حق حی قیوم هو سلام صبر شکر امید عدل نام خدا ایران تهران شیراز حافظ سعدی مولوی فردوسی خیام نظامی عطار شعر بهار گل باغ شب روز ماه خورشید آسمان زمین دریا عاشق معشوق جمال کمال جلال لیلی مجنون شیرین فرهاد رستم سهراب رضا مهدی امیر مهران پارسا آرش سیاوش جمشید کاوه داریوش بابک ستاره نسیم باران برف کوه رود سبز سرخ آبی شاد غم درد شادی زندگی مرگ عمر وفا ایمان یقین رحمت برکت نعمت قدرت'.split(' ');
let WORD_IDX=null;
function knownWords(n){
  if(!WORD_IDX){WORD_IDX=new Map();WORDS.forEach(w=>{const v=abjadSum(w);if(!WORD_IDX.has(v))WORD_IDX.set(v,[]);WORD_IDX.get(v).push(w)})}
  return (WORD_IDX.get(n)||[]).slice(0,6);
}
function letterBox(title,text){
  const letters=[],counts=new Map();
  for(const ch of text){const l=letterOf(ch);if(l){letters.push(l);counts.set(l,(counts.get(l)||0)+1)}}
  const order=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fa'));
  let sel=order.length?order[0][0]:null;
  const line=h('div',{class:'lt-line'}),chips=h('div',{class:'lt-chips'});
  const paint=()=>{
    line.replaceChildren(...[...text].map(ch=>{const l=letterOf(ch);return l&&l===sel?h('span',{class:'hit',text:ch}):ch}));
    chips.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.l===sel));
  };
  order.forEach(([l,n])=>chips.append(h('button',{type:'button',class:'chip','data-l':l,text:`${l}: ${toFa(n)}`,onclick:()=>{sel=l;paint()}})));
  paint();
  return h('div',{class:'lt'},h('div',{class:'lt-h',text:`شمار نویسه‌های همصدای ${title} (از ${toFa(letters.length)} نویسه)`}),line,chips);
}

/* ================= verse details ================= */
const beitCache=new Map();
async function beitCountOf(id){
  if(beitCache.has(id))return beitCache.get(id);
  const d=await get(`/poem/${id}?catInfo=false&catPoems=false&rhymes=false&recitations=false&images=false&songs=false&comments=false&verseDetails=false&navigation=false&relatedpoems=false`);
  const n=countBeits(d.verses,d.plainText);beitCache.set(id,n);return n;
}
async function computeBook(ctx){
  const s=ctx.bk;
  if(s.state==='run'||s.state==='done')return;
  const fire=()=>s.subs.forEach(f=>f());
  s.state='run';s.pct=0;fire();
  try{
    if(!ctx.catId){s.state='na';fire();return}
    const d=await get(`/cat/${ctx.catId}?poems=true&mainSections=false`);
    const list=(d.cat||d).poems||[];
    const idx=list.findIndex(x=>String(x.id)===String(ctx.poemId));
    if(idx<0){s.state='na';fire();return}
    if(idx>400){s.state='big';fire();return}
    let sum=0;const before=list.slice(0,idx);
    for(let i=0;i<before.length;i+=8){
      const part=await Promise.all(before.slice(i,i+8).map(x=>beitCountOf(x.id)));
      sum+=part.reduce((a,b)=>a+b,0);
      s.pct=Math.round((i+part.length)/before.length*100);fire();
    }
    s.offset=sum;s.state='done';fire();
  }catch{s.state='na';fire()}
}
function buildInfo(b,i,ctx){

  box.append(kv('شماره بیت در شعر',`${toFa(i+1)} از ${toFa(ctx.total)}`));
  const bk=h('span');

    if(s.state==='done')bk.replaceChildren(toFa(s.offset+i+1));
    else if(s.state==='run')bk.replaceChildren(`در حال محاسبه… ${toFa(s.pct||0)}٪`);
    else if(s.state==='na')bk.replaceChildren('قابل محاسبه نیست');
    else if(s.state==='big')bk.replaceChildren('کتاب بزرگ است؛ محاسبه نشد');
    else bk.replaceChildren(h('button',{class:'mini',type:'button',text:'محاسبه',onclick:()=>computeBook(ctx)}));

  box.append(col('وزن بیت',ctx.metre||'در گنجور ثبت نشده است.'));
  box.append(letterBox('مصراع ۱',b.a));
  if(b.b)box.append(letterBox('مصراع ۲',b.b));

  const ab=h('div',{class:'lt'},h('div',{class:'lt-h',text:'ابجد'}),kv('مصراع ۱',toFa(a1)));
  if(b.b)ab.append(kv('مصراع ۲',toFa(a2)));
  ab.append(kv('کل بیت',toFa(a1+a2)));
  box.append(ab);
  return box;
}

const FAMOUS=[['حافظ',['حافظ']],['سعدی',['سعدی']],['مولانا',['مولوی','مولانا']],['فردوسی',['فردوسی']],['خیام',['خیام']],['صائب',['صائب']],['عطار',['عطار']],['نظامی',['نظامی']],['شهریار',['شهریار']]];
function findPoet(poets,keys){
  for(const k of keys){
    const nk=norm(k);
    const p=poets.find(x=>norm(x.name)===nk)||poets.find(x=>norm(x.name).startsWith(nk))||poets.find(x=>norm(x.name).includes(nk));
    if(p)return p;
  }
  return null;
}
function poetImgUrls(p){
  const out=[],u=p.imageUrl||p.image||p.imageURL;
  if(u)out.push(/^https?:/.test(u)?u:'https://api.ganjoor.net'+(u.startsWith('/')?'':'/')+u);
  const slug=(p.fullUrl||p.urlSlug||'').split('/').filter(Boolean).pop();
  if(slug)out.push(`https://api.ganjoor.net/api/ganjoor/poet/image/${slug}.gif`);
  return out;
}
function attachImg(host,p){

function poetCard(p,img){

const ORD=['','اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم','سیزدهم','چهاردهم','پانزدهم'];
function centuryOf(p){
  const b=p.birthYearInLHijri,d=p.deathYearInLHijri;
  const y=b>0?b:(d>0?d:0);
  return y>0?Math.ceil(y/100):0;
}
function centuryGroups(poets){
  const g=new Map();
  poets.forEach(p=>{const c=centuryOf(p);if(c>=1&&c<=15){if(!g.has(c))g.set(c,[]);g.get(c).push(p)}});
  return g;
}
function parseCentury(term){
  const m=norm(term).match(/^(?:قرن|سده)\s*(.+)$/);
  if(!m)return 0;
  const w=m[1].replace(/\s*(هجری.*|ه\.?ق.*)$/,'').trim();
  if(/^\d+$/.test(w))return +w;
  const i=ORD.findIndex((o,k)=>k&&norm(o)===w);
  return i>0?i:0;
}
function centuryResults(c,poets){
  const ps=poets.filter(p=>centuryOf(p)===c);
  return h('section',{},
    h('div',{class:'sec-h'},h('h2',{text:`شاعران قرن ${toFa(c)} هجری`}),h('span',{class:'note',text:toFa(ps.length)+' شاعر'})),
    ps.length?h('div',{class:'grid',style:'margin-bottom:20px'},ps.map(p=>poetCard(p,true))):h('p',{class:'muted',text:'شاعری با تاریخ ثبت‌شده برای این قرن پیدا نشد.'}));
}
function fillCenturies(box,poets){
  const groups=centuryGroups(poets);
  const cs=[...groups.keys()].sort((a,b)=>a-b);
  const row=h('div',{class:'cent-row'}),list=h('div',{class:'cent-list'});
  let cur=0;
  const show=c=>{
    cur=c;
    row.querySelectorAll('.cchip').forEach(b=>b.classList.toggle('on',+b.dataset.c===c));
    if(!c){list.replaceChildren();return}
    const g=h('div',{class:'grid'},groups.get(c).map(p=>poetCard(p,true)));
    list.replaceChildren(g);pop(g.children);
  };
  cs.forEach(c=>row.append(h('button',{class:'cchip',type:'button','data-c':c,onclick:()=>show(cur===c?0:c)},`قرن ${toFa(c)}`,h('small',{text:toFa(groups.get(c).length)}))));
  box.replaceChildren(
    h('div',{class:'sec-h'},h('h2',{text:'بر اساس قرن'}),h('span',{class:'note',text:'هجری قمری؛ در جستجو هم می‌توانید بنویسید «قرن هشتم»'})),
    cs.length?row:h('p',{class:'muted',text:'تاریخ شاعران در دسترس نیست.'}),list);
}

/* ================= books and shelf ================= */
const BOOKS={list:[],done:false,p:null,subs:[],n:0,total:0,nt:0};
const SPINE_COLORS=['#3d6b2b','#2c6a73','#2b5470','#6b2d3a','#7a5a2a','#4a3a6b','#2f5d4a','#6b3f2a'];
function booksNotify(now){clearTimeout(BOOKS.nt);const go=()=>BOOKS.subs.slice().forEach(f=>f());now?go():(BOOKS.nt=setTimeout(go,250))}
function booksLoad(){
  if(BOOKS.p)return BOOKS.p;
  BOOKS.p=(async()=>{
    let poets;
    try{poets=await getPoets()}catch{BOOKS.done=true;booksNotify(true);return}
    try{
      const c=JSON.parse(localStorage.getItem('gj-books-v1')||'null');
      if(c&&c.l&&c.l.length&&Date.now()-c.t<6048e5){
        BOOKS.list=c.l.map(([id,title,poet,pid])=>({id,title,poet,pid}));BOOKS.done=true;booksNotify(true);return;
      }
    }catch{}
    const fam=FAMOUS.map(([,k])=>findPoet(poets,k)).filter(Boolean);
    const ids=new Set(fam.map(p=>p.id));
    const queue=[...fam,...poets.filter(p=>!ids.has(p.id))];
    BOOKS.total=queue.length;
    const work=async()=>{
      while(queue.length){
        const p=queue.shift();
        try{
          const d=await get(`/cat/${p.rootCatId}?poems=false&mainSections=false`);
          ((d.cat||d).children||[]).forEach(x=>BOOKS.list.push({id:x.id,title:x.title,poet:p.name,pid:p.id}));
        }catch{}
        BOOKS.n++;booksNotify();
      }
    };
    await Promise.all(Array.from({length:5},work));
    BOOKS.done=true;
    try{localStorage.setItem('gj-books-v1',JSON.stringify({t:Date.now(),l:BOOKS.list.map(b=>[b.id,b.title,b.poet,b.pid])}))}catch{}
    booksNotify(true);
  })();
  return BOOKS.p;
}
function spine(b){
  return h('a',{class:'spine',href:'#/cat/'+b.id,title:`${b.poet} — ${b.title}`,style:`--c:${SPINE_COLORS[b.id%SPINE_COLORS.length]};--sh:${214+(b.id*7)%34}px`},
    h('span',{class:'sp-t'},h('span',{text:b.title})),
    h('span',{class:'sp-a'},h('span',{text:b.poet})));
}
function renderShelfSection(box){
  const shelf=h('div',{class:'shelf',tabindex:'0','aria-label':'قفسهٔ کتاب‌ها'});
  const sentinel=h('span',{class:'sentinel','aria-hidden':'true'});
  const note=h('p',{class:'note',style:'text-align:center;margin-top:6px'});
  box.append(h('div',{class:'shelf-h',text:'قفسهٔ کتاب‌ها'}),h('div',{class:'shelf-wrap'},shelf),note);
  for(let i=0;i<8;i++)shelf.append(h('span',{class:'spine sk',style:'--sh:'+(214+(i*17)%34)+'px'}));
  let shown=0,started=false,chk=0;
  const near=()=>{
    const a=sentinel.getBoundingClientRect(),b=shelf.getBoundingClientRect();
    return a.right>b.left-400&&a.left<b.right+400;
  };
  const more=()=>{
    if(!started){if(!BOOKS.list.length)return;shelf.replaceChildren();started=true}
    const part=BOOKS.list.slice(shown,shown+36);
    if(!part.length)return;
    part.forEach(b=>shelf.append(spine(b)));
    shown+=part.length;
    shelf.append(sentinel);
    if(shown<BOOKS.list.length)requestAnimationFrame(()=>{if(near())more()});
  };
  const sub=()=>{
    if(!document.body.contains(shelf)){BOOKS.subs=BOOKS.subs.filter(f=>f!==sub);return}
    if(!started||near())more();
    note.textContent=BOOKS.done?'':`در حال بارگذاری فهرست کتاب‌ها… ${toFa(BOOKS.n)} از ${toFa(BOOKS.total||0)} شاعر`;
  };
  shelf.addEventListener('scroll',()=>{if(chk)return;chk=requestAnimationFrame(()=>{chk=0;if(started&&shown<BOOKS.list.length&&near())more()})},{passive:true});
  BOOKS.subs.push(sub);booksLoad();sub();
}

/* ================= side panel ================= */
const PANEL={open:false,view:'menu'};
const PANEL_TITLES={menu:'منو',favs:'دلخواه‌ها',fonts:'خط شعر',fal:'فال حافظ',abjad:'محاسبه‌گر ابجد'};
function buildPanel(){
  const back=h('button',{class:'icon-btn',type:'button',id:'pback','aria-label':'بازگشت',onclick:()=>showView('menu')});back.innerHTML=ICON.back;
  const close=h('button',{class:'icon-btn',type:'button','aria-label':'بستن',onclick:closePanel});close.innerHTML=ICON.close;
  [back,close].forEach(b=>b.firstChild.setAttribute('style','fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round'));
  const panel=h('aside',{class:'panel glass',id:'panel','aria-hidden':'true'},
    h('div',{class:'phead'},back,h('h2',{id:'ptitle',text:'منو'}),close),
    h('div',{class:'pbody',id:'pbody'}));
  document.body.append(h('div',{class:'scrim',onclick:closePanel}),panel);
}
function showView(name){
  PANEL.view=name;
  const body=$('#pbody');
  $('#pback').style.display=name==='menu'?'none':'';
  $('#ptitle').textContent=PANEL_TITLES[name];
  const v={menu:menuView,favs:favView,fonts:fontView,fal:falView,abjad:abjadView}[name]();
  body.replaceChildren(v);
  body.scrollTop=0;
  if(!reduced&&body.animate)body.animate([{opacity:0,transform:'translateX(-18px)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.22,1,.36,1)'});
}
function openPanel(name){
  if(!$('#panel'))buildPanel();
  showView(name||'menu');
  document.body.classList.add('panel-open');
  $('#panel').setAttribute('aria-hidden','false');
  PANEL.open=true;
}
function closePanel(){
  document.body.classList.remove('panel-open');
  const p=$('#panel');if(p)p.setAttribute('aria-hidden','true');
  PANEL.open=false;
}
function menuView(){
  const item=(icon,t,d,v)=>{
    const ic=h('span',{class:'pic'});ic.innerHTML=icon;
    return h('button',{class:'pitem',type:'button',onclick:()=>showView(v)},ic,h('span',{},h('b',{text:t}),h('small',{text:d})));
  };
  return h('div',{},
    item(ICON.heart,'دلخواه‌ها','شعرهای نشان‌شدهٔ شما','favs'),
    item(ICON.pen,'خط','انتخاب خط شعرها از ۱۰ خط','fonts'),
    item(ICON.fal,'فال حافظ','یک غزل به همراه معنی','fal'),
    item(ICON.calc,'محاسبه‌گر ابجد','متن به ابجد و ابجد به متن','abjad'));
}
function favView(){
  const a=favs.all();
  if(!a.length)return h('p',{class:'muted pnote',text:'هنوز شعری نشان نکرده‌اید. در صفحهٔ هر شعر روی ستاره بزنید.'});
  return h('div',{class:'plist'},a.map(f=>{
    const x=h('button',{class:'icon-btn sm',type:'button','aria-label':'حذف از دلخواه‌ها'});x.innerHTML=ICON.close;
    const row=h('div',{class:'prow'},h('a',{href:'#/poem/'+f.id,onclick:closePanel},h('b',{text:f.title}),h('small',{text:f.poet})),x);
    x.onclick=()=>{favs.toggle(f);row.remove();toast('از دلخواه‌ها برداشته شد')};
    return row;
  }));
}
function fontView(){
  const cur=fontKey();
  const wrap=h('div',{class:'plist'});
  FONTS.forEach(f=>{
    loadFontPreview(f);
    const b=h('button',{class:'fitem'+(f.k===cur?' on':''),type:'button',onclick:()=>{
      setFont(f.k);wrap.querySelectorAll('.fitem').forEach(x=>x.classList.toggle('on',x===b));toast('خط: '+f.n);
    }},h('span',{class:'fsample',style:`font-family:${f.f},'Vazirmatn',serif`,text:FONT_SAMPLE}),h('small',{text:f.n}));
    wrap.append(b);
  });
  return wrap;
}
function falView(){
  const box=h('div',{class:'fal'});
  async function draw(){
    box.replaceChildren(skeleton(3));
    try{
      const poets=await getPoets();
      const hf=findPoet(poets,['حافظ']);
      if(!hf)throw new Error('no poet');
      const root=await get(`/cat/${hf.rootCatId}?poems=false&mainSections=false`);
      const gz=((root.cat||root).children||[]).find(c=>/غزل/.test(c.title));
      const d=await get(`/cat/${gz?gz.id:hf.rootCatId}?poems=true&mainSections=false`);
      const list=(d.cat||d).poems||[];
      if(!list.length)throw new Error('empty');
      const pick=list[Math.floor(Math.random()*list.length)];
      const p=await get('/poem/'+pick.id+POEM_Q);
      const blocks=toBlocks(p.verses,p.plainText);
      const sum=(p.poemSummary||'').trim();
      const hasMean=blocks.some(b=>b.m);
      box.replaceChildren(
        h('h3',{class:'fal-t',text:p.title}),
        renderBlocks(blocks,true,{mean:true}),
        sum?h('div',{class:'sum'},h('b',{text:'معنی و تفسیر'}),h('p',{text:sum})):(hasMean?null:h('p',{class:'muted pnote',text:'معنی این غزل هنوز در گنجور ثبت نشده است.'})),
        h('div',{class:'fal-act'},
          h('button',{class:'btn',type:'button',text:'فال دوباره',onclick:draw}),
          h('a',{class:'btn primary',href:'#/poem/'+p.id,onclick:closePanel,text:'صفحهٔ غزل'})));
    }catch(e){box.replaceChildren(errorBox(draw))}
  }
  box.append(h('div',{class:'fal-intro'},h('div',{class:'fal-orb'}),
    h('p',{class:'muted',style:'margin-bottom:14px',text:'یک لحظه چشم ببند، نیت کن و دلت را به حافظ بسپار.'}),
    h('button',{class:'btn primary',type:'button',text:'گرفتن فال',onclick:draw})));
  return box;
}
function abjadView(){
  let mode='t2a';
  const ta=h('textarea',{class:'ta',rows:'3',dir:'auto','aria-label':'ورودی',placeholder:'متن را بنویسید…'});
  const out=h('div');
  const b1=h('button',{type:'button',class:'on',text:'متن ← ابجد'}),b2=h('button',{type:'button',text:'ابجد ← متن'});
  const setMode=m=>{
    mode=m;b1.classList.toggle('on',m==='t2a');b2.classList.toggle('on',m==='a2t');
    ta.placeholder=m==='t2a'?'متن را بنویسید…':'یک یا چند عدد بنویسید؛ مثلاً ۷۸۶ یا ۱۳۱۳';
    calc();
  };
  b1.onclick=()=>setMode('t2a');b2.onclick=()=>setMode('a2t');
  function calc(){
    if(mode==='t2a'){
      const ws=ta.value.split(/\s+/).filter(Boolean).map(w=>[w,abjadSum(w)]).filter(x=>x[1]>0);
      if(!ws.length){out.replaceChildren();return}
      const total=ws.reduce((a,x)=>a+x[1],0);
      out.replaceChildren(h('div',{class:'abig'},h('small',{text:'مجموع ابجد'}),h('b',{text:toFa(total)})),
        h('div',{class:'achips'},ws.map(([w,v])=>h('span',{class:'chip',text:`${w}: ${toFa(v)}`}))));
    }else{
      const nums=(ta.value.match(/[\d۰-۹٠-٩]+/g)||[]).map(x=>+norm(x)).filter(n=>n>0&&n<=100000);
      if(!nums.length){out.replaceChildren();return}
      const ls=nums.map(numToLetters);
      const known=nums.map(n=>knownWords(n));
      const head=nums.map((n,i)=>known[i][0]||ls[i]).join(' ');
      out.replaceChildren(
        h('div',{class:'abig'},h('small',{text:'متن ابجدی'}),h('b',{style:'font-size:1.7rem;overflow-wrap:anywhere',text:head})),
        ...nums.map((n,i)=>h('div',{class:'abrow'},h('small',{text:toFa(n)}),
          h('div',{class:'achips'},[...known[i],ls[i]].filter((w,k,a)=>a.indexOf(w)===k).map(w=>h('span',{class:'chip',text:w}))))),
        h('p',{class:'note',style:'margin-top:10px',text:'هر عدد را می‌شود با چند ترکیب از حروف ابجد خواند. اول واژه‌های آشنای هم‌ارز و در پایان کوتاه‌ترین ترکیب حروف نشان داده می‌شود.'}));
    }
  }
  ta.addEventListener('input',calc);
  return h('div',{},h('div',{class:'seg'},b1,b2),ta,out);
}
document.addEventListener('pointerdown',e=>{
  if(reduced)return;
  const b=e.target.closest&&e.target.closest('.tbtn,.btn,.icon-btn,.cchip,.chip,.mini,.pitem,.fitem,.seg button');
  if(!b||b.classList.contains('fav'))return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2;
  const dot=h('span',{class:'rip',style:`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`});
  b.append(dot);setTimeout(()=>dot.remove(),700);
},{passive:true});
$('#menu').onclick=()=>PANEL.open?closePanel():openPanel('menu');
addEventListener('keydown',e=>{if(e.key==='Escape'&&PANEL.open)closePanel()});

(function seo(){
  if(!/^https?:$/.test(location.protocol))return;
  const u=location.origin+location.pathname;
  const add=(tag,a)=>{const e=document.createElement(tag);for(const k in a)e.setAttribute(k,a[k]);document.head.append(e)};
  add('link',{rel:'canonical',href:u});add('meta',{property:'og:url',content:u});
})();
applyFont(fontKey());
addEventListener('hashchange',render);
render();
</script>
